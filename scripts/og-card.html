<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with:
     "Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png scripts/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif; color: #fff; box-sizing: border-box; padding: 72px 80px;
    background: radial-gradient(900px 420px at 92% -10%, rgba(227,154,45,.35), transparent 70%), #16262f;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 600; letter-spacing: 0.12em; }
  .brand img { width: 60px; height: 60px; }
  h1 { font-size: 68px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 800; margin: 0 0 24px; }
  h1 span { color: #f0a93e; }
  p { font-size: 28px; color: #b6c4cc; margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #b6c4cc; }
  .pills span { border: 1px solid #3b5564; border-radius: 999px; padding: 8px 18px; margin-right: 10px; color: #e8edf0; }
</style>
</head>
<body>
  <div class="brand"><img src="../public/favicon.png" alt="">SOAJS</div>
  <div>
    <h1>Turn your microservices<br><span>into multi-tenant products.</span></h1>
    <p>The open-source gateway for tenants, per-API ACL and OAuth.</p>
  </div>
  <div class="foot">
    <div class="pills"><span>Tenants</span><span>ACL</span><span>OAuth</span><span>Traffic</span></div>
    <div>soajs.org</div>
  </div>
</body>
</html>
